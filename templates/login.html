{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<section class="auth-section">

    <div class="auth-card">

        <div class="auth-header">

            <h1>Welcome Back 👋</h1>

            <p>

                Login to continue using SmartRecipe AI.

            </p>

        </div>

        <form method="POST">

            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    name="email"
                    required
                >

            </div>

            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    name="password"
                    required
                >

            </div>

            <button
                class="auth-btn"
                type="submit">

                Login

            </button>

        </form>

        <div class="auth-footer">

            Don't have an account?

            <a href="/register">

                Register

            </a>

        </div>

    </div>

</section>

{% endblock %}
